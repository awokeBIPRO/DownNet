name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK + unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.12 (Chaquopy buildPython)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ubuntu-latest images ship the Android SDK with cmdline-tools; the
      # setup-android action's default package list references the removed
      # 'tools' package and fails, so we drive sdkmanager ourselves.
      - name: Install platform and NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973" >/dev/null
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/27.0.12077973" >>"$GITHUB_ENV"

      - name: Cache native binaries (ffmpeg / ffprobe / quickjs)
        id: native-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs
          key: native-${{ runner.os }}-${{ hashFiles('native/build-binaries.sh') }}
          restore-keys: |
            native-${{ runner.os }}-

      - name: Cross-build ffmpeg / ffprobe / quickjs
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: bash native/build-binaries.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build + unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: downnet-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
