name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Cross-build native binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ubuntu-latest ships the SDK with cmdline-tools; only the NDK is
      # needed for the cross-build (the setup-android action's default
      # package list references the removed 'tools' package and fails).
      - name: Install NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          "$SDKMANAGER" --install "ndk;27.0.12077973" >/dev/null
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/27.0.12077973" >>"$GITHUB_ENV"

      - name: Cache native binaries (ffmpeg / ffprobe / quickjs)
        id: native-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs
          key: native-${{ runner.os }}-${{ hashFiles('native/build-binaries.sh') }}

      - name: Cross-build ffmpeg / ffprobe / quickjs
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: bash native/build-binaries.sh

  build:
    name: Build debug APK + unit tests
    needs: native
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.12 (Chaquopy buildPython)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install platform and build-tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0" >/dev/null

      - name: Restore native binaries
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs
          key: native-${{ runner.os }}-${{ hashFiles('native/build-binaries.sh') }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build + unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: downnet-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

  ytdlp-smoke:
    name: yt-dlp + QuickJS extraction smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Host build of the same QuickJS-NG tag the app bundles. The runner has
      # no deno either, so this exercises exactly the runtime fallback the
      # Android build relies on.
      - name: Build host quickjs (same tag as the app)
        run: |
          git clone --depth 1 --branch v0.18.0 https://github.com/quickjs-ng/quickjs /tmp/qjs
          cmake -B /tmp/qjs/build -S /tmp/qjs -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build /tmp/qjs/build --target qjs_exe -j "$(nproc)" >/dev/null
          QJS="$(find /tmp/qjs/build -type f \( -name qjs -o -name qjs_exe \) | head -1)"
          echo "qjs at $QJS"
          "$QJS" --version
          echo "QJS=$QJS" >>"$GITHUB_ENV"

      - name: Install pinned yt-dlp (same as the app)
        run: pip install "yt-dlp[default]==2026.11.23"

      # The app's real bridge, a real video, the real runtime. If video
      # formats come back, the wiring is right everywhere but the device.
      - name: Run the app's bridge.py through QuickJS against a real video
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, "app/src/main/python")
          import bridge
          qjs = os.environ["QJS"]
          raw = bridge.extract(
              "https://www.youtube.com/watch?v=jNQXAC9IVRw", js_runtime=qjs)
          resp = json.loads(raw)
          assert resp["ok"], f"bridge extraction failed: {resp.get('error')}"
          formats = resp["info"]["formats"]
          video = [f for f in formats if f.get("vcodec") not in (None, "none")]
          audio = [f for f in formats if f.get("acodec") not in (None, "none")]
          print(f"formats={len(formats)} video={len(video)} audio={len(audio)}")
          print("engine:", bridge.selfcheck(qjs))
          assert video, "NO VIDEO FORMATS - JS runtime not engaging"
          PY
